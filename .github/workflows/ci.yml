name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: ABI check (grammar wasm loads on web-tree-sitter)
        run: npm run abi-check
      - name: publish dry-run
        run: npm publish --dry-run --ignore-scripts
